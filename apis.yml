aid: incognia
name: Incognia
description: >-
  Incognia is a location identity and device fingerprinting platform for fraud
  prevention, providing real-time risk assessments for user onboarding, login,
  and payment transactions. Its API returns low_risk / high_risk / unknown_risk
  verdicts by combining privacy-first device recognition, location behavior
  analysis, and tamper detection, and accepts feedback events (chargebacks,
  account takeover, identity fraud, accepted/declined outcomes) that continuously
  tune the risk model. Incognia is used across financial services, fintech,
  marketplaces, delivery, and gaming to stop account takeover, new-account fraud,
  and payment fraud while reducing friction for trusted users. Authentication is
  OAuth 2.0 client credentials, exchanged for short-lived bearer tokens; official
  SDKs ship for Node.js, Python, Ruby, Java, and Go.
